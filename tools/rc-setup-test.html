<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controller Setup Test</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../src/rc-setup.css">
  <script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script>
  <style>
    body { background: radial-gradient(ellipse at 30% 20%, #3a5a78, #1a2733 55%, #0d0f12); }
    .t-bar {
      position: fixed; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--glass-strong);
    }
    .t-bar select { font: inherit; color: var(--text); background: #2a2e35; border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
    #out { position: fixed; left: 12px; bottom: 12px; margin: 0; font: 12px var(--mono); color: var(--muted); }
  </style>
</head>
<body>
  <!-- Bağımsız deneme: sahte kumanda. ?lang=en|tr|de &src=bridge|serial|gamepad|touch|none &tab=test|cal|tune|pad &open=1 -->
  <div class="t-bar">
    <button type="button" id="openBtn" class="primary">Open</button>
    <select id="srcSel">
      <option value="bridge">bridge</option>
      <option value="serial">serial</option>
      <option value="gamepad">gamepad</option>
      <option value="touch">touch</option>
      <option value="none">none (keyboard)</option>
    </select>
    <select id="motionSel">
      <option value="anim">anim</option>
      <option value="rest">rest</option>
      <option value="sweep">sweep</option>
    </select>
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="tr">TR</button>
    <button type="button" data-lang="de">DE</button>
  </div>
  <pre id="out"></pre>
  <script type="module">
    import { settings, save } from '../src/settings.js';
    import { createRcSetup } from '../src/rc-setup.js';
    import { pickPreset, padName, PRESETS } from '../src/gamepad.js';

    const qs = new URLSearchParams(location.search);
    settings.lang = qs.get('lang') || 'en';
    const out = document.getElementById('out');

    // sahte gamepad (navigator.getGamepads yerine)
    const pad = {
      index: 0,
      id: 'Xbox Wireless Controller (STANDARD GAMEPAD Vendor: 045e Product: 0b13)',
      mapping: 'standard',
      connected: true,
      axes: [0, 0, 0, 0],
      buttons: Array.from({ length: 17 }, () => ({ pressed: false, value: 0 })),
    };
    Object.defineProperty(navigator, 'getGamepads', { value: () => [pad], configurable: true });

    // sahte kumanda: Controllers arayüzünün kullanılan kısmı
    const BTN = ['photo', 'rth', 'camera', 'fn', 'takeoff', 'land', 'view', 'modeUp', 'modeDown'];
    const fake = {
      sticks: { lh: 0, lv: 0, rh: 0, rv: 0, wheel: 0 },
      buttons: Object.fromEntries(BTN.map((n) => [n, false])),
      rawButtons: null,
      switchMode: 'N',
      src: qs.get('src') || 'bridge',
      motion: 'anim',
      gamepad: { preset: 'auto', activePreset: 'standard', pad: { index: 0, id: pad.id, mapping: 'standard' } },
      get source() { return this.src; },
      get live() { return this.src !== 'none'; },
      get sourceName() { return this.src === 'gamepad' ? padName(pad.id) : ''; },
      setGamepadPreset(n) {
        this.gamepad.preset = n || 'auto';
        this.gamepad.activePreset = pickPreset(pad, this.gamepad.preset);
      },
    };

    const t0 = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const t = (now - t0) / 1000;
      const s = fake.sticks;
      if (fake.motion === 'rest') {
        // bırakılmış çubuklar: hafif merkez kayması + gürültü
        Object.assign(s, { lh: 0.06, lv: -0.04, rh: -0.03, rv: 0.05, wheel: 0.02 });
        for (const k in s) s[k] += (Math.random() - 0.5) * 0.01;
      } else if (fake.motion === 'sweep') {
        // uçlara kadar daireler (biraz eksik menzil: max 0.92)
        s.lh = 0.92 * Math.cos(t * 6);
        s.lv = 0.9 * Math.sin(t * 6);
        s.rh = 0.95 * Math.sin(t * 5);
        s.rv = 0.88 * Math.cos(t * 5);
        s.wheel = 0.9 * Math.sin(t * 4);
      } else {
        s.lh = 0.85 * Math.sin(t * 0.9);
        s.lv = 0.08 + 0.8 * Math.cos(t * 1.3);
        s.rh = 0.95 * Math.sin(t * 1.1 + 1);
        s.rv = 0.9 * Math.cos(t * 0.7);
        s.wheel = Math.sin(t * 0.5);
      }
      for (const k in s) s[k] = Math.max(-1, Math.min(1, s[k]));
      // tuşlar sırayla, mod anahtarı 4 sn'de bir
      const names = fake.src === 'gamepad' ? Object.values(PRESETS[fake.gamepad.activePreset].buttons) : BTN;
      const on = names[Math.floor(t / 0.6) % Math.max(1, names.length)];
      for (const n of BTN) fake.buttons[n] = fake.src !== 'none' && n === on && t % 0.6 < 0.4;
      fake.switchMode = fake.src === 'bridge' || fake.src === 'serial' ? ['C', 'N', 'S'][Math.floor(t / 4) % 3] : null;
      // gamepad ham eksenleri (standart: dikeyler ters)
      pad.axes = [s.lh, -s.lv, s.rh, -s.rv];
      pad.buttons.forEach((b, i) => {
        const p = PRESETS.standard.buttons[i];
        b.pressed = !!p && fake.buttons[p];
        b.value = b.pressed ? 1 : 0;
      });
      pad.buttons[7].value = Math.max(0, s.wheel);
      pad.buttons[6].value = Math.max(0, -s.wheel);
      pad.buttons[7].pressed = pad.buttons[7].value > 0.5;
      pad.buttons[6].pressed = pad.buttons[6].value > 0.5;
    }
    requestAnimationFrame(animate);

    const rcSetup = createRcSetup({
      rc: fake,
      settings,
      save,
      onChange: (k) => (out.textContent = `onChange → ${k}`),
    });
    document.getElementById('openBtn').onclick = () => rcSetup.open();
    const srcSel = document.getElementById('srcSel');
    srcSel.value = fake.src;
    srcSel.onchange = () => (fake.src = srcSel.value);
    const motionSel = document.getElementById('motionSel');
    motionSel.onchange = () => (fake.motion = motionSel.value);
    for (const b of document.querySelectorAll('[data-lang]')) {
      b.onclick = () => {
        settings.lang = b.dataset.lang;
        rcSetup.setLang();
      };
    }
    window.fake = fake;
    window.rcSetup = rcSetup;
    window.settings = settings;
    window.pad = pad;
    if (qs.get('open')) rcSetup.open();
  </script>
</body>
</html>
