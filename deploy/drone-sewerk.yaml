# drone.sewerk.de: statik simülatör (nginx) + online odalar (rooms.py), tek pod.
# Kod GitHub'daki sabit commit'ten init kapsayıcısıyla çekilir; imaj derlemeye gerek yok.
# Güncelleme: REV'i yeni commit'e çek, `kubectl apply -f` yeter.
# Herkese açık yol: Cloudflare (HTTPS) → haproxy-public-ingress → bu servis. Ana sitenin kaynaklarına dokunmaz.
apiVersion: v1
kind: Namespace
metadata:
  name: drone
  labels:
    app.kubernetes.io/part-of: drone-flight-simulator
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: drone-head
  namespace: drone
data:
  # index.html <head> içine eklenir: yerel kumanda köprüsü kapalı, odalar wss, paylaşım önizlemesi
  head.html: |
      <meta name="rc-bridge" content="off">
      <meta name="rooms-url" content="wss://drone.sewerk.de/rooms">
      <meta name="nrw-tiles-base" content="https://drone-tiles.sewerk.de">
      <meta name="description" content="Fly a drone in your browser over real places — with a real DJI RC-N3, a gamepad, the keyboard or touch. Google 3D, satellite and OpenStreetMap worlds, online rooms. Open source.">
      <link rel="canonical" href="https://drone.sewerk.de/">
      <meta property="og:type" content="website">
      <meta property="og:url" content="https://drone.sewerk.de/">
      <meta property="og:title" content="Drone Flight Simulator">
      <meta property="og:description" content="Fly a drone in your browser over real places — with a real DJI RC-N3, a gamepad, the keyboard or touch. Open source.">
      <meta property="og:image" content="https://drone.sewerk.de/docs/launcher.jpg">
      <meta name="twitter:card" content="summary_large_image">
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: drone-nginx
  namespace: drone
data:
  # uygulama dosyaları her açılışta doğrulanır (değişmediyse 304): güncellemeler Cloudflare'de takılmaz.
  # büyük, seyrek değişen dosyalar 1 gün önbellekte. Depo iç dosyaları servis edilmez.
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        server_tokens off;
        location / {
            include /etc/nginx/conf.d/security.inc;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ =404;
        }
        location ~* ^/(vendor|assets|docs)/ {
            include /etc/nginx/conf.d/security.inc;
            add_header Cache-Control "public, max-age=86400" always;
        }
        location ~* ^/(deploy|tools)/ { return 404; }
        location ~* \.(py|sh|command|yaml|yml)$ { return 404; }
        location ~ /\. { return 404; }
    }
  security.inc: |
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(self), serial=(self), gamepad=(self), camera=(), microphone=(), payment=()" always;
    # CSP: betik yalnız kendi sunucumuzdan (+ index.html'deki importmap'in sabit özeti, + Draco wasm);
    # harita karoları (Google/Esri/OpenFreeMap/AWS/R2) için https: geniş bırakıldı, online oda yalnız wss kendi alanımız;
    # blob:/data: şart: GLTFLoader gömülü dokuları blob adresinden fetch eder (yoksa 3B karolar dokusuz kalır).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-47SYuv52ST9yQ76ncm8OHvWn4zem0EXrZt9l4WuC2XY=' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https: wss://drone.sewerk.de blob: data:; worker-src 'self' blob:; font-src 'self' data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drone
  namespace: drone
  labels: { app: drone }
spec:
  replicas: 1 # odalar bellekte tutulur: tek kopya
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: drone }
  template:
    metadata:
      labels: { app: drone }
    spec:
      automountServiceAccountToken: false # kubernetes API'ye ihtiyaç yok
      securityContext:
        runAsNonRoot: true
        runAsUser: 10101
        runAsGroup: 10101
        fsGroup: 10101
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: fetch
          image: alpine/git:2.54.0
          env:
            - { name: REV, value: "c9575723ebbaacddf3b7445fcd682fc094e6887b" }
            - { name: HOME, value: /tmp }
          command: ["sh", "-c"]
          args:
            - |
              set -e
              git clone --quiet --filter=blob:none https://github.com/sewerkde/drone-flight-simulator.git /app/www
              cd /app/www && git checkout --quiet "$REV" && rm -rf .git
              sed -i '/name="viewport"/r /cfg/head.html' index.html
              grep -q 'rooms-url' index.html
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: app, mountPath: /app }
            - { name: head, mountPath: /cfg }
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.31.6-alpine
          ports: [{ name: http, containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 300m, memory: 64Mi }
          volumeMounts:
            - { name: app, mountPath: /usr/share/nginx/html, subPath: www, readOnly: true }
            - { name: nginx, mountPath: /etc/nginx/conf.d, readOnly: true }
        - name: rooms
          image: python:3.12.15-alpine
          command: ["python", "/app/www/rooms.py", "8766", "0.0.0.0"]
          env:
            # yalnız bu siteden bağlanılır; IP başına ve toplam bağlantı sınırı
            - { name: ROOMS_ORIGINS, value: "https://drone.sewerk.de" }
            - { name: ROOMS_MAX_CONN, value: "400" }
            - { name: ROOMS_MAX_PER_IP, value: "8" }
            - { name: ROOMS_MAX_ROOMS, value: "300" }
          ports: [{ name: rooms, containerPort: 8766 }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            tcpSocket: { port: rooms }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 500m, memory: 128Mi }
          volumeMounts:
            - { name: app, mountPath: /app, readOnly: true }
      volumes:
        - name: app
          emptyDir: { sizeLimit: 64Mi }
        - name: head
          configMap: { name: drone-head }
        - name: nginx
          configMap: { name: drone-nginx }
---
apiVersion: v1
kind: Service
metadata:
  name: drone
  namespace: drone
spec:
  selector: { app: drone }
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: rooms, port: 8766, targetPort: rooms }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: haproxy-public-ingress
  namespace: drone
spec:
  ingressClassName: haproxy
  rules:
    - host: drone.sewerk.de
      http:
        paths:
          - path: /rooms
            pathType: Prefix
            backend: { service: { name: drone, port: { number: 8766 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: drone, port: { number: 80 } } }
